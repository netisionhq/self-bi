name: Deploy Superset (Dev)

on:
  push:
    branches: [ superset-frontend ]

concurrency:
  group: superset-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ✅ Prevent hanging builds

    steps:
      - name: Deploy Superset to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60m 
          script: |
            set -e  # ✅ Fail fast

            echo "🚀 Starting Superset Deployment..."

            # -----------------------------
            # 1. Navigate to Project
            # -----------------------------
            cd /root/apps/self-bi

            echo "📌 Current Branch:"
            git branch

            echo "📌 Git Status:"
            git status

            echo "📌 Recent Commits:"
            git log --oneline -5

            # -----------------------------
            # 2. Pull Latest Code (SAFE)
            # -----------------------------
            echo "⬇️ Pulling latest code..."

            git fetch origin
            git checkout superset-frontend
            git reset --hard origin/superset-frontend   # ✅ avoids dirty state

            echo "📌 Latest Changes:"
            git log --oneline -5

            # -----------------------------
            # 3. Stop Existing Containers
            # -----------------------------
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose-non-dev.yml down || true

            # -----------------------------
            # 4. Build Images (Optimized)
            # -----------------------------
            echo "🏗️ Building Docker images..."
            docker compose -f docker-compose-non-dev.yml build --progress plain

            # -----------------------------
            # 5. Start Services
            # -----------------------------
            echo "🚀 Starting containers..."
            docker compose -f docker-compose-non-dev.yml up -d

            # -----------------------------
            # 6. Wait for Init Container
            # -----------------------------
            echo "⏳ Waiting for init container..."
            sleep 40

            echo "📌 Init Logs:"
            docker logs superset_init --tail 50 || true

            # -----------------------------
            # 7. Fix 'Created' State Issue
            # -----------------------------
            if docker ps -a | grep -q "Created"; then
              echo "⚠️ Containers stuck in Created state. Fixing..."
              docker start superset_app superset_worker superset_worker_beat || true
              sleep 10
            fi

            # -----------------------------
            # 8. Verify Containers
            # -----------------------------
            echo "🔍 Checking running containers..."
            docker ps | grep superset

            # -----------------------------
            # 9. Health Check (CRITICAL)
            # -----------------------------
            echo "🩺 Running health check..."

            for i in {1..10}; do
              if curl -f http://localhost:8088/health; then
                echo "✅ Superset is healthy!"
                break
              fi
              echo "⏳ Waiting for Superset..."
              sleep 10
            done

            # Final fail-safe
            curl -f http://localhost:8088/health || {
              echo "❌ Superset health check failed!"
              docker logs superset_app --tail 100
              exit 1
            }

            echo "🎉 Deployment Completed Successfully!"
